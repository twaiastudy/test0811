<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁版俄羅斯方塊</title>
    <style>
        body { 
            background: #202028; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin-top: 50px; 
        }
        canvas { 
            background: #111; 
            border: 2px solid #333; 
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1); 
            border-radius: 5px;
        }
        #score { 
            font-size: 28px; 
            font-weight: bold;
            margin-bottom: 15px; 
            color: #FFE138;
        }
        .controls { 
            margin-top: 20px; 
            text-align: center; 
            color: #aaa; 
            font-size: 14px;
        }
        kbd {
            background-color: #eee;
            border-radius: 3px;
            border: 1px solid #b4b4b4;
            box-shadow: 0 1px 1px rgba(0,0,0,.2), 0 2px 0 0 rgba(255,255,255,.7) inset;
            color: #333;
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            line-height: 1;
            padding: 2px 4px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="score">分數: 0</div>
    <!-- 遊戲畫布：設定寬 240px，高 400px -->
    <canvas id="tetris" width="240" height="400"></canvas>
    
    <div class="controls">
        <p>控制方式：<br><br>
        <kbd>←</kbd> <kbd>→</kbd> 左右移動 &nbsp;|&nbsp; <kbd>↓</kbd> 加速落下 &nbsp;|&nbsp; <kbd>↑</kbd> 旋轉方塊</p>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        // 將畫布放大 20 倍，這樣我們就可以用 1x1 的單位來計算方塊 (12欄 x 20列)
        context.scale(20, 20); 

        // 消除方塊與計分邏輯
        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y; // 因為陣列被平移了，所以同一列要再檢查一次
                player.score += rowCount * 10;
                rowCount *= 2; // 連消分數加倍
            }
        }

        // 碰撞偵測
        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        // 建立遊戲區域矩陣 (二維陣列)
        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        // 定義所有俄羅斯方塊的形狀與顏色索引
        function createPiece(type) {
            if (type === 'I') return [[0,1,0,0], [0,1,0,0], [0,1,0,0], [0,1,0,0]];
            if (type === 'L') return [[0,2,0], [0,2,0], [0,2,2]];
            if (type === 'J') return [[0,3,0], [0,3,0], [3,3,0]];
            if (type === 'O') return [[4,4], [4,4]];
            if (type === 'Z') return [[5,5,0], [0,5,5], [0,0,0]];
            if (type === 'S') return [[0,6,6], [6,6,0], [0,0,0]];
            if (type === 'T') return [[0,7,0], [7,7,7], [0,0,0]];
        }

        // 繪製矩陣 (包含已經固定的方塊與正在下落的方塊)
        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        // 渲染畫面
        function draw() {
            context.fillStyle = '#111';
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        // 將落到底部的方塊合併進遊戲區域矩陣中
        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        // 方塊下落邏輯
        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        // 左右移動
        function playerMove(offset) {
            player.pos.x += offset;
            if (collide(arena, player)) {
                player.pos.x -= offset;
            }
        }

        // 隨機生成新方塊，若生成時就發生碰撞，則遊戲結束(重置)
        function playerReset() {
            const pieces = 'TJLOSZI';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            
            // 遊戲結束判定
            if (collide(arena, player)) {
                arena.forEach(row => row.fill(0));
                player.score = 0;
                updateScore();
            }
        }

        // 旋轉方塊並處理靠牆旋轉的邊界問題 (Wall Kick)
        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        // 矩陣旋轉數學邏輯 (轉置 + 反轉)
        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        // 遊戲迴圈控制
        let dropCounter = 0;
        let dropInterval = 1000; // 每秒下落一格
        let lastTime = 0;

        function update(time = 0) {
            const deltaTime = time - lastTime;
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }
            lastTime = time;
            draw();
            requestAnimationFrame(update);
        }

        // 更新分數顯示
        function updateScore() {
            document.getElementById('score').innerText = '分數: ' + player.score;
        }

        // 設定顏色
        const colors = [
            null,
            '#0DC2FF', // I - 青色
            '#FF8E0D', // L - 橘色
            '#3877FF', // J - 藍色
            '#FFE138', // O - 黃色
            '#FF0D72', // Z - 紅色
            '#0DFF72', // S - 綠色
            '#F538FF'  // T - 紫色
        ];

        // 建立 12 欄 20 列的遊戲空間
        const arena = createMatrix(12, 20);

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            score: 0
        };

        // 監聽鍵盤事件
        document.addEventListener('keydown', event => {
            if (event.keyCode === 37) { // 左
                playerMove(-1);
            } else if (event.keyCode === 39) { // 右
                playerMove(1);
            } else if (event.keyCode === 40) { // 下
                playerDrop();
            } else if (event.keyCode === 38) { // 上
                playerRotate(1);
            }
        });

        // 啟動遊戲
        playerReset();
        updateScore();
        update();
    </script>
</body>
</html>
